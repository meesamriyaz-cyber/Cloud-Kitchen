name: Verify and fix license integration
on:
  push:
    branches: [bootstrap-mongodb-setup]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix generated Setup.js escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/Setup.js')
          s=p.read_text()
          s=s.replace('import React, { useEffect, useState } from "react";\n', 'import React, { useEffect, useState } from "react";\nimport axios from "axios";\n', 1) if 'import axios from "axios";' not in s else s
          s=s.replace('\\n', '\n')
          p.write_text(s)
          PY
      - name: Syntax check backend
        run: |
          node --check backend/index.js
          node --check backend/licenseRouter.js
      - name: Install frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build
      - name: Verify integration markers
        run: |
          grep -q "app.use('/api/license', licenseRouter)" backend/index.js
          grep -q "'/api/license/status'" backend/index.js
          grep -q "'/api/license/activate'" backend/index.js
          grep -q "router.post('/activate'" backend/licenseRouter.js
          grep -q "Application Activation" frontend/src/pages/Setup.js
          grep -q "activateLicense" frontend/src/pages/Setup.js
          grep -q "axios.post" frontend/src/pages/Setup.js
      - name: Commit fixes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Setup.js
          git commit -m 'Fix Cloud Kitchen activation UI syntax' || true
          git rm .github/workflows/verify-fix-license-integration.yml
          git commit -m 'Remove temporary license verification workflow'
          git push