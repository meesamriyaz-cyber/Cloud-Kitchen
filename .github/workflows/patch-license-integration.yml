name: Patch Cloud Kitchen license integration

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap-mongodb-setup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const backend = 'backend/index.js';
          let s = fs.readFileSync(backend, 'utf8');
          s = s.replace("import { fileURLToPath } from 'url';", "import { fileURLToPath } from 'url';\nimport licenseRouter from './licenseRouter.js';");
          s = s.replace("  '/api/bootstrap/initialize',\n]);", "  '/api/bootstrap/initialize',\n  '/api/license/status',\n  '/api/license/activate',\n]);");
          s = s.replace("app.use(express.json({ limit: '2mb' }));", "app.use(express.json({ limit: '2mb' }));\napp.use('/api/license', licenseRouter);");
          fs.writeFileSync(backend, s);

          const setup = 'frontend/src/pages/Setup.js';
          let u = fs.readFileSync(setup, 'utf8');
          u = u.replace('import { CheckCircle2, ChefHat, Database, Eye, EyeOff, Loader2, Store, UserRound }', 'import { CheckCircle2, ChefHat, Database, Eye, EyeOff, KeyRound, Loader2, Store, UserRound }');
          u = u.replace('  mongo_url: "",\n', '  mongo_url: "",\n  activation_code: "",\n');
          u = u.replace('  const [saving, setSaving] = useState(false);', '  const [saving, setSaving] = useState(false);\n  const [activatingLicense, setActivatingLicense] = useState(false);\n  const [licenseActivated, setLicenseActivated] = useState(false);');
          const activationFn = `  const activateLicense = async () => {\n    const code = form.activation_code.trim().toUpperCase();\n    if (!code) { toast.error("Enter the activation code from Cutting Edge Marketplace"); return; }\n    setActivatingLicense(true);\n    try {\n      await axios.post(\`${process.env.REACT_APP_BACKEND_URL}/api/license/activate\`, { code });\n      setLicenseActivated(true);\n      toast.success("Application activated");\n    } catch (err) {\n      toast.error(err.response?.data?.detail || "Activation failed");\n    } finally {\n      setActivatingLicense(false);\n    }\n  };\n\n`;
          u = u.replace('  const submit = async (event) => {', activationFn + '  const submit = async (event) => {');
          u = u.replace('    if (!form.mongo_url.trim()) {\n      toast.error("MongoDB connection URL is required");\n      return;\n    }', '    if (!licenseActivated) {\n      toast.error("Activate the application before initialization");\n      return;\n    }\n    if (!form.mongo_url.trim()) {\n      toast.error("MongoDB connection URL is required");\n      return;\n    }');
          const marker = '        <section className="grid gap-5 md:grid-cols-2">';
          const block = `        <section className="soft-panel p-5 md:p-6 border-primary/20 bg-primary/5">\n          <h2 className="font-display text-xl font-semibold flex items-center gap-2"><KeyRound size={18} /> Application Activation</h2>\n          <p className="text-sm text-stone-500 dark:text-stone-400 mt-1">Generate an activation code from your Cutting Edge Marketplace account and enter it here.</p>\n          <div className="mt-5 flex flex-col sm:flex-row gap-3">\n            <Input value={form.activation_code} onChange={e => { setLicenseActivated(false); update("activation_code", e.target.value); }} placeholder="10-character activation code" maxLength={10} className="h-11 rounded-xl font-mono tracking-widest uppercase" />\n            <Button type="button" disabled={activatingLicense || saving || licenseActivated} onClick={activateLicense} className="rounded-xl">\n              {activatingLicense ? <Loader2 size={16} className="mr-2 animate-spin" /> : <KeyRound size={16} className="mr-2" />}\n              {licenseActivated ? "Activated" : activatingLicense ? "Activating..." : "Activate"}\n            </Button>\n          </div>\n          {licenseActivated && <p className="mt-3 inline-flex items-center gap-1.5 text-sm text-emerald-700"><CheckCircle2 size={16} /> License verified for this device</p>}\n        </section>\n\n`;
          u = u.replace(marker, block + marker);
          fs.writeFileSync(setup, u);
          NODE
      - name: Verify
        run: |
          grep -q "licenseRouter" backend/index.js
          grep -q "api/license/activate" frontend/src/pages/Setup.js
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.js frontend/src/pages/Setup.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Cloud Kitchen device licensing"
          git push
          git rm .github/workflows/patch-license-integration.yml
          git commit -m "Remove temporary license patch workflow"
          git push
